<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gilded · Seating Chart & Card Studio</title>
  <meta name="description" content="Design a mirror-worthy seating chart, then print a card for every table and a name card for every guest. Private, offline-ready, no account needed.">
  <meta name="theme-color" content="#16130f">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gilded">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/great-vibes-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/parisienne-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/artboard.css">
  <link rel="stylesheet" href="css/print.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="boot" role="status" aria-live="polite">
      <div class="boot-brand">
        <svg class="brand-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path d="M13 54V34a19 19 0 0 1 38 0v20" stroke="#c9a35c" stroke-width="3.2" stroke-linecap="round"/>
          <rect x="24" y="26" width="16" height="20" rx="1.2" fill="#f7f0e1"/>
          <path d="M27.5 32h9M27.5 35.5h10.5M27.5 39h8.5M27.5 42.5h10" stroke="#8c7a60" stroke-width="1.05" stroke-linecap="round"/>
          <circle cx="32" cy="25" r="3.4" fill="#e6c98e" stroke="#8a6a34" stroke-width=".9"/>
        </svg>
        <span>Gilded</span>
      </div>
      <div class="boot-line"><i></i></div>
      <p>Opening the studio</p>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <noscript>
    <div class="noscript">Gilded needs JavaScript to design and save your seating charts.</div>
  </noscript>
  <script type="module" src="js/app.js"></script>

</html>
